name: Build Glass Spike (liquidDX11)

# Spike, not product. Two executables:
#
#   liquidDX11.exe          - the reference, unmodified, for comparison
#   BetterCastGlassSpike.exe - BetterCast's pages in that shell, driving the
#                              real Qt core in-process
#
# The second one exists to answer the architecture question rather than argue
# it: whether BetterCast's own ServiceDiscovery, and an OpenGL widget like the
# one the receive path renders through, survive inside a D3D11 render loop.
#
# Overlay rather than reimplement. liquidDX11's layout lives in its main.cpp -
# fonts at set sizes, a scale factor threaded through every width, panel
# sizing, chrome, page switching - and a hand-written window reproduced none of
# it. So its tree is copied and only the page bodies, nav labels and three
# anchored lines of main.cpp are changed. Every patch asserts it applied.
#
# Delete spike/ and this file and none of it remains.

on:
  workflow_dispatch:
  push:
    branches: [fix/windows-sender-latency-topology]
    paths:
      - '.github/workflows/build-glass-spike.yml'
      - 'spike/**'

concurrency:
  group: glass-spike-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: '6.7.0'
  # Same spec and cache tag as build-windows-receiver.yml, so this shares that
  # workflow's vcpkg cache instead of building FFmpeg a second time.
  VCPKG_SPEC: 'ffmpeg[x264,nvcodec,amf]:x64-windows'
  VCPKG_CACHE_TAG: 'ffmpeg-x264-nvcodec-amf-v1'

jobs:
  build-spike:
    runs-on: windows-latest

    steps:
      - name: Check out liquidDX11
        uses: actions/checkout@v4
        with:
          repository: StephenLovino/liquidDX11
          path: liquidDX11

      - name: Check out BetterCast
        uses: actions/checkout@v4
        with:
          path: bettercast

      - name: Install Qt 6
        shell: pwsh
        run: |
          pip install aqtinstall
          python -m aqt install-qt windows desktop ${{ env.QT_VERSION }} win64_msvc2019_64 `
            --outputdir C:/Qt
          echo "Qt6_DIR=C:/Qt/${{ env.QT_VERSION }}/msvc2019_64" >> $env:GITHUB_ENV
          echo "C:/Qt/${{ env.QT_VERSION }}/msvc2019_64/bin" >> $env:GITHUB_PATH

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: |
            C:/vcpkg/installed
            C:/vcpkg/buildtrees
            C:/vcpkg/packages
          key: vcpkg-x64-windows-${{ env.VCPKG_CACHE_TAG }}
          restore-keys: |
            vcpkg-x64-windows-

      - name: Install FFmpeg via vcpkg
        shell: pwsh
        run: |
          vcpkg install "$env:VCPKG_SPEC" --recurse
        env:
          VCPKG_ROOT: C:/vcpkg

      - name: Build liquidDX11 unmodified
        shell: pwsh
        run: |
          cmake -S liquidDX11 -B build-ref -A x64
          cmake --build build-ref --config Release

      - name: Overlay BetterCast onto a copy of liquidDX11
        shell: pwsh
        run: |
          Copy-Item -Recurse liquidDX11 liquid-bc

          $pages = 'liquid-bc/examples/example_win32_directx11/src/app/pages'
          Copy-Item bettercast/spike/glass-ui/pages/*.inc $pages -Force
          Write-Host "overlaid pages: $((Get-ChildItem bettercast/spike/glass-ui/pages/*.inc).Name -join ', ')"

          $main = 'liquid-bc/examples/example_win32_directx11/src/main.cpp'
          $t = Get-Content $main -Raw

          # Normalise to LF before matching. actions/checkout hands this file
          # over with CRLF on Windows, so any pattern spanning a line break
          # silently fails to match - which is exactly what broke the entry
          # point patch. [char]13/[char]10 rather than escapes, since backslash
          # sequences have not survived this repo's tooling reliably.
          $lf = [string][char]10
          $t = $t.Replace([string][char]13 + $lf, $lf)

          # Nav labels, or the sidebar still reads General / Display / Battery.
          $t = $t.Replace(
            'const char* navLabels[] = { "General", "Display", "Battery", "Storage", "Customize" };',
            'const char* navLabels[] = { "Devices", "Hotspot", "Send", "Receive", "Settings" };')
          $t = $t.Replace(
            'const char* pages[8] = { "General","Display","Battery","Storage","Customize","View Profile","Account Settings","Apps" };',
            'const char* pages[8] = { "Devices","Hotspot","Send","Receive","Settings","View Profile","Account Settings","Apps" };')
          if ($t -notmatch 'Devices') { throw "nav label patch did not apply" }

          # Branding. "Glass" appears as the sidebar wordmark, the sign-in
          # heading, the dynamic island title and the app name on every
          # notification. Replacing the quoted string catches all of them and
          # leaves the Glass:: namespace alone.
          $before = $t
          $t = $t.Replace('"Glass"', '"BetterCast"')
          $t = $t.Replace('L"Glass Overlay"', 'L"BetterCast"')
          if ($t -eq $before) { throw "branding patch did not apply" }

          # 1. The bridge header.
          $before = $t
          $t = $t.Replace(
            '#include <vector>',
            "#include <vector>`n#include `"BetterCastBridge.h`"")
          if ($t -eq $before) { throw "include patch did not apply" }

          # 2. Name the argv parameters and start the Qt core. The signature is
          #    int main(int, char**) upstream, so argc/argv are unreachable
          #    until they are given names.
          $before = $t
          $t = $t.Replace(
            "int main(int, char**)`n{",
            "int main(int bc_argc, char** bc_argv)`n{`n    BetterCastBridge::init(bc_argc, bc_argv);")
          if ($t -eq $before) { throw "entry point patch did not apply" }

          # 3. Pump Qt once per frame, then skip the frame entirely when
          #    nothing has changed. Without the pump nothing Qt-driven ever
          #    runs; without the skip this redraws at 60fps forever, which is
          #    right for a showcase and wrong for an app that sits open all
          #    day. shouldRender sleeps before returning false, so `continue`
          #    does not spin.
          $before = $t
          $t = $t.Replace(
            '        if (done) break;',
            "        if (done) break;`n        BetterCastBridge::pump();`n        if (!BetterCastBridge::shouldRender()) continue;")
          if ($t -eq $before) { throw "event pump patch did not apply" }

          # 4. Taskbar and title-bar icon. The class registers with a null
          #    hIcon upstream, so Windows shows the generic default.
          $before = $t
          $t = $t.Replace(
            'GetModuleHandle(nullptr), nullptr, nullptr, nullptr, nullptr, L"GlassOverlay", nullptr };',
            'GetModuleHandle(nullptr), (HICON)BetterCastBridge::appIconHandle(), nullptr, nullptr, nullptr, L"GlassOverlay", (HICON)BetterCastBridge::appIconHandle() };')
          if ($t -eq $before) { throw "window icon patch did not apply" }

          # 5. The account chip is a hardcoded demo login upstream. BetterCast
          #    has no accounts; the chip becomes the name this machine
          #    advertises under, with its address beneath.
          $before = $t
          $t = $t.Replace(
            '"acct", "poncipp", "@pondot", "PO",',
            '"acct", BetterCastBridge::userName().c_str(), BetterCastBridge::userHandle().c_str(), BetterCastBridge::userInitials().c_str(),')
          if ($t -eq $before) { throw "account chip patch did not apply" }

          # 6. Hide the demo-surface dock - media, web, card and the rest are
          #    liquidDX11's sample gallery, not BetterCast features. Hidden
          #    rather than deleted, so it can come back if it earns a place.
          $before = $t
          $t = $t.Replace(
            'int d = Glass::SurfaceDock(dockCx, o.y + innerH - 6.0f, innerW - sideW - 20.0f,',
            'int d = -1; if (false) d = Glass::SurfaceDock(dockCx, o.y + innerH - 6.0f, innerW - sideW - 20.0f,')
          if ($t -eq $before) { throw "surface dock patch did not apply" }

          # 7. Sidebar mark. The real logo needs a texture upload; a display
          #    glyph at least stops it being someone else's spark.
          $t = $t.Replace(
            'Glass::DrawIcon(wdl, Glass::Icon::Spark,',
            'Glass::DrawIcon(wdl, Glass::Icon::Display,')

          Set-Content $main $t -Encoding utf8
          Write-Host "main.cpp patched: bridge, entry point, pump, icon, account, dock, mark"

      - name: Add the BetterCast core to the spike target
        shell: pwsh
        run: |
          # CMake wants forward slashes; [char]92 avoids writing a backslash
          # literal, which has not survived this repo's tooling reliably.
          $sep   = [char]92
          $ws    = (Get-Location).Path.Replace($sep, '/')
          $spike = "$ws/bettercast/spike/glass-app"
          $core  = "$ws/bettercast/Sources/BetterCastReceiverDesktop"

          # An array joined with newlines, not a here-string: a PowerShell
          # here-string terminator has to sit at column 0, and inside a YAML
          # block scalar a column-0 line ends the block and breaks the file.
          #
          # Appended rather than merged: liquidDX11 builds one executable from
          # its own main.cpp, and this adds the Qt core to that same target.
          # AUTOMOC is a target property because CMAKE_AUTOMOC only applies to
          # targets declared after it, and this runs long after add_executable.
          $block = @(
            '',
            '# ---- BetterCast bridge (spike only) ----',
            'find_package(Qt6 REQUIRED COMPONENTS Core Gui Widgets Network OpenGL OpenGLWidgets)',
            'set_target_properties(liquidDX11 PROPERTIES AUTOMOC ON)',
            'target_sources(liquidDX11 PRIVATE',
            "    `"$spike/BetterCastBridge.cpp`"",
            "    `"$spike/BetterCastBridge.h`"",
            "    `"$core/ServiceDiscovery.cpp`"",
            "    `"$core/ServiceDiscovery.h`"",
            "    `"$core/LogManager.h`"",
            "    `"$core/NetworkListener.cpp`"",
            "    `"$core/NetworkListener.h`"",
            "    `"$core/VideoDecoder.cpp`"",
            "    `"$core/VideoDecoder.h`"",
            "    `"$core/VideoRenderer.cpp`"",
            "    `"$core/VideoRenderer.h`"",
            "    `"$core/AudioDecoder.cpp`"",
            "    `"$core/AudioDecoder.h`"",
            "    `"$core/sender/SenderController.cpp`"",
            "    `"$core/sender/SenderController.h`"",
            "    `"$core/sender/VideoEncoderFF.cpp`"",
            "    `"$core/sender/NetworkSender.cpp`"",
            "    `"$core/sender/NetworkSender.h`"",
            "    `"$core/sender/ScreenCaptureWin.cpp`"",
            "    `"$core/sender/VirtualDisplayVDD.cpp`"",
            "    `"$core/sender/VirtualDisplayVDD.h`"",
            "    `"$core/sender/InputInjector.cpp`"",
            "    `"$core/sender/InputInjector.h`"",
            "    `"$core/sender/ScreenCapture.h`"",
            "    `"$core/sender/ScreenCaptureWin.h`"",
            "    `"$core/sender/VideoEncoderFF.h`"",
            ')',
            "target_include_directories(liquidDX11 PRIVATE `"$spike`" `"$core`")",
            'target_compile_definitions(liquidDX11 PRIVATE ENABLE_SENDER=1)',
            'find_package(FFMPEG REQUIRED)',
            'target_include_directories(liquidDX11 PRIVATE ${FFMPEG_INCLUDE_DIRS})',
            'target_link_directories(liquidDX11 PRIVATE ${FFMPEG_LIBRARY_DIRS})',
            'target_link_libraries(liquidDX11 PRIVATE',
            '    Qt6::Core Qt6::Gui Qt6::Widgets Qt6::Network Qt6::OpenGL Qt6::OpenGLWidgets',
            '    ${FFMPEG_LIBRARIES}',
            '    d3d11 dxgi setupapi user32 winmm ws2_32)'
          ) -join "`n"
          Add-Content 'liquid-bc/CMakeLists.txt' $block -Encoding utf8
          Write-Host "appended BetterCast core from $core"

      - name: Build the BetterCast glass spike
        shell: pwsh
        run: |
          cmake -S liquid-bc -B build-spike -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="C:/vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DCMAKE_PREFIX_PATH="$env:Qt6_DIR"
          cmake --build build-spike --config Release

          $out = Get-ChildItem -Path build-spike -Filter 'liquidDX11.exe' -Recurse | Select-Object -First 1
          if (-not $out) { throw "the BetterCast build produced no exe" }
          Rename-Item $out.FullName 'BetterCastGlassSpike.exe'

      - name: Collect
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null

          $ref = Get-ChildItem -Path build-ref -Filter 'liquidDX11.exe' -Recurse | Select-Object -First 1
          if (-not $ref) { throw "the reference build produced no exe" }
          Copy-Item $ref.FullName out/
          Write-Host "built: liquidDX11.exe  $([math]::Round($ref.Length/1MB,1)) MB"

          $bc = Get-ChildItem -Path build-spike -Filter 'BetterCastGlassSpike.exe' -Recurse | Select-Object -First 1
          if (-not $bc) { throw "the BetterCast build produced no exe" }
          Copy-Item $bc.FullName out/
          Write-Host "built: BetterCastGlassSpike.exe  $([math]::Round($bc.Length/1MB,1)) MB"

          # Qt runtime beside the binary, or the spike will not start on a
          # machine without Qt on PATH - which is every machine but the runner.
          & "$env:Qt6_DIR/bin/windeployqt.exe" --release --no-translations `
            --no-system-d3d-compiler --no-opengl-sw "out/BetterCastGlassSpike.exe"

          # FFmpeg's DLLs too. windeployqt only knows about Qt, so without this
          # the spike dies at startup on "avcodec-61.dll was not found" - which
          # is what happened the first time the sender was linked in. The main
          # Windows workflow copies these the same way.
          $vcpkgBin = "C:/vcpkg/installed/x64-windows/bin"
          if (-not (Test-Path $vcpkgBin)) { throw "vcpkg bin missing - FFmpeg DLLs cannot be bundled" }
          Get-ChildItem "$vcpkgBin/*.dll" | ForEach-Object { Copy-Item $_.FullName out/ }

          # Fail here rather than on the user's machine.
          foreach ($need in 'avcodec-61.dll', 'avutil-59.dll', 'avformat-61.dll', 'swscale-8.dll') {
            if (-not (Test-Path "out/$need")) {
              Write-Host "note: $need not present; bundled DLLs are:"
              Get-ChildItem 'out/av*.dll', 'out/sw*.dll' -ErrorAction SilentlyContinue |
                ForEach-Object { Write-Host "  $($_.Name)" }
            }
          }
          $av = Get-ChildItem 'out/avcodec-*.dll' -ErrorAction SilentlyContinue
          if (-not $av) { throw "no avcodec DLL was bundled" }

          # App icon, generated the same way build-windows-receiver.yml does so
          # the taskbar shows the rounded BetterCast mark rather than a default.
          pip install --quiet Pillow
          python -c "
          from PIL import Image, ImageDraw
          src = Image.open('bettercast/Sources/BetterCastReceiverDesktop/icon_256x256.png').convert('RGBA')
          size = max(src.size)
          src = src.resize((size, size), Image.LANCZOS)
          mask = Image.new('L', (size * 4, size * 4), 0)
          ImageDraw.Draw(mask).rounded_rectangle([0, 0, size * 4 - 1, size * 4 - 1], radius=int(size * 4 * 0.22), fill=255)
          mask = mask.resize((size, size), Image.LANCZOS)
          out = Image.new('RGBA', (size, size), (0, 0, 0, 0))
          out.paste(src, (0, 0), mask)
          out.save('out/appicon.ico', sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)])
          "
          if (-not (Test-Path 'out/appicon.ico')) { throw "appicon.ico was not generated" }

          # Both apps load fonts from beside the binary.
          foreach ($d in 'data', 'misc/fonts') {
            $src = Join-Path 'liquidDX11' $d
            if (Test-Path $src) { Copy-Item -Recurse $src out/ -ErrorAction SilentlyContinue }
          }

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: liquidDX11-glass-spike
          path: out/
          if-no-files-found: error
