name: Build Glass Spike (liquidDX11)

# Two executables, plus an installer:
#
#   liquidDX11.exe      - the reference, unmodified, for comparing against
#   BetterCastGlass.exe - BetterCast's pages in that shell, driving the real
#                         Qt core in-process
#
# The second one began as a spike, to answer the architecture question rather
# than argue it: whether BetterCast's own ServiceDiscovery, and an OpenGL
# widget like the one the receive path renders through, survive inside a D3D11
# render loop. They do, so it now ships as an installer rather than a zip.
#
# Overlay rather than reimplement. liquidDX11's layout lives in its main.cpp -
# fonts at set sizes, a scale factor threaded through every width, panel
# sizing, chrome, page switching - and a hand-written window reproduced none of
# it. So its tree is copied and only the page bodies, nav labels and three
# anchored lines of main.cpp are changed. Every patch asserts it applied.
#
# Delete spike/ and this file and none of it remains.

on:
  workflow_dispatch:
  push:
    branches: [fix/windows-sender-latency-topology]
    paths:
      - '.github/workflows/build-glass-spike.yml'
      - 'spike/**'

concurrency:
  group: glass-spike-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: '6.7.0'
  # Same spec and cache tag as build-windows-receiver.yml, so this shares that
  # workflow's vcpkg cache instead of building FFmpeg a second time.
  VCPKG_SPEC: 'ffmpeg[x264,nvcodec,amf]:x64-windows'
  VCPKG_CACHE_TAG: 'ffmpeg-x264-nvcodec-amf-v1'
  # Kept in step with build-windows-receiver.yml on purpose: a machine with both
  # apps installed should not end up with two different display drivers.
  VDD_VERSION: '25.7.23'

jobs:
  build-spike:
    runs-on: windows-latest

    steps:
      - name: Check out liquidDX11
        uses: actions/checkout@v4
        with:
          repository: StephenLovino/liquidDX11
          path: liquidDX11

      - name: Check out BetterCast
        uses: actions/checkout@v4
        with:
          path: bettercast

      - name: Install Qt 6
        shell: pwsh
        run: |
          pip install aqtinstall
          # qtmultimedia for AudioPlayer's QAudioSink: without it the receive
          # path plays no sound, which is how the spike shipped silent.
          python -m aqt install-qt windows desktop ${{ env.QT_VERSION }} win64_msvc2019_64 `
            --modules qtmultimedia `
            --outputdir C:/Qt
          echo "Qt6_DIR=C:/Qt/${{ env.QT_VERSION }}/msvc2019_64" >> $env:GITHUB_ENV
          echo "C:/Qt/${{ env.QT_VERSION }}/msvc2019_64/bin" >> $env:GITHUB_PATH

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: |
            C:/vcpkg/installed
            C:/vcpkg/buildtrees
            C:/vcpkg/packages
          key: vcpkg-x64-windows-${{ env.VCPKG_CACHE_TAG }}
          restore-keys: |
            vcpkg-x64-windows-

      - name: Install FFmpeg via vcpkg
        shell: pwsh
        run: |
          vcpkg install "$env:VCPKG_SPEC" --recurse
        env:
          VCPKG_ROOT: C:/vcpkg

      - name: Build liquidDX11 unmodified
        shell: pwsh
        run: |
          cmake -S liquidDX11 -B build-ref -A x64
          cmake --build build-ref --config Release

      - name: Overlay BetterCast onto a copy of liquidDX11
        shell: pwsh
        run: |
          Copy-Item -Recurse liquidDX11 liquid-bc

          $pages = 'liquid-bc/examples/example_win32_directx11/src/app/pages'
          Copy-Item bettercast/spike/glass-ui/pages/*.inc $pages -Force
          Write-Host "overlaid pages: $((Get-ChildItem bettercast/spike/glass-ui/pages/*.inc).Name -join ', ')"

          $main = 'liquid-bc/examples/example_win32_directx11/src/main.cpp'
          $t = Get-Content $main -Raw

          # Normalise to LF before matching. actions/checkout hands this file
          # over with CRLF on Windows, so any pattern spanning a line break
          # silently fails to match - which is exactly what broke the entry
          # point patch. [char]13/[char]10 rather than escapes, since backslash
          # sequences have not survived this repo's tooling reliably.
          $lf = [string][char]10
          $t = $t.Replace([string][char]13 + $lf, $lf)

          # Nav labels, or the sidebar still reads General / Display / Battery.
          $t = $t.Replace(
            'const char* navLabels[] = { "General", "Display", "Battery", "Storage", "Customize" };',
            'const char* navLabels[] = { "Devices", "Hotspot", "Send", "Receive", "Settings" };')
          $t = $t.Replace(
            'const char* pages[8] = { "General","Display","Battery","Storage","Customize","View Profile","Account Settings","Apps" };',
            'const char* pages[8] = { "Devices","Hotspot","Send","Receive","Settings","View Profile","Account Settings","Apps" };')
          if ($t -notmatch 'Devices') { throw "nav label patch did not apply" }

          # Branding. "Glass" appears as the sidebar wordmark, the sign-in
          # heading, the dynamic island title and the app name on every
          # notification. Replacing the quoted string catches all of them and
          # leaves the Glass:: namespace alone.
          $before = $t
          $t = $t.Replace('"Glass"', '"BetterCast"')
          $t = $t.Replace('L"Glass Overlay"', 'L"BetterCast"')
          if ($t -eq $before) { throw "branding patch did not apply" }

          # 1. The bridge header.
          $before = $t
          $t = $t.Replace(
            '#include <vector>',
            "#include <vector>`n#include `"BetterCastBridge.h`"")
          if ($t -eq $before) { throw "include patch did not apply" }

          # 2. Name the argv parameters and start the Qt core. The signature is
          #    int main(int, char**) upstream, so argc/argv are unreachable
          #    until they are given names.
          $before = $t
          $t = $t.Replace(
            "int main(int, char**)`n{",
            "int main(int bc_argc, char** bc_argv)`n{`n    BetterCastBridge::init(bc_argc, bc_argv);")
          if ($t -eq $before) { throw "entry point patch did not apply" }

          # 3. Pump Qt once per frame, then skip the frame entirely when
          #    nothing has changed. Without the pump nothing Qt-driven ever
          #    runs; without the skip this redraws at 60fps forever, which is
          #    right for a showcase and wrong for an app that sits open all
          #    day. shouldRender sleeps before returning false, so `continue`
          #    does not spin.
          $before = $t
          $t = $t.Replace(
            '        if (done) break;',
            "        if (done) break;`n        BetterCastBridge::pump();`n        if (!BetterCastBridge::shouldRender()) continue;")
          if ($t -eq $before) { throw "event pump patch did not apply" }

          # 4. Taskbar and title-bar icon. The class registers with a null
          #    hIcon upstream, so Windows shows the generic default.
          $before = $t
          $t = $t.Replace(
            'GetModuleHandle(nullptr), nullptr, nullptr, nullptr, nullptr, L"GlassOverlay", nullptr };',
            'GetModuleHandle(nullptr), (HICON)BetterCastBridge::appIconHandle(), nullptr, nullptr, nullptr, L"GlassOverlay", (HICON)BetterCastBridge::appIconHandle() };')
          if ($t -eq $before) { throw "window icon patch did not apply" }

          # 5. The account chip is a hardcoded demo login upstream. BetterCast
          #    has no accounts; the chip becomes the name this machine
          #    advertises under, with its address beneath.
          $before = $t
          $t = $t.Replace(
            '"acct", "poncipp", "@pondot", "PO",',
            '"acct", BetterCastBridge::userName().c_str(), BetterCastBridge::userHandle().c_str(), BetterCastBridge::userInitials().c_str(),')
          if ($t -eq $before) { throw "account chip patch did not apply" }

          # 6. Hide the demo-surface dock - media, web, card and the rest are
          #    liquidDX11's sample gallery, not BetterCast features. Hidden
          #    rather than deleted, so it can come back if it earns a place.
          $before = $t
          $t = $t.Replace(
            'int d = Glass::SurfaceDock(dockCx, o.y + innerH - 6.0f, innerW - sideW - 20.0f,',
            'int d = -1; if (false) d = Glass::SurfaceDock(dockCx, o.y + innerH - 6.0f, innerW - sideW - 20.0f,')
          if ($t -eq $before) { throw "surface dock patch did not apply" }

          # 7. Sidebar mark. The real logo needs a texture upload; a display
          #    glyph at least stops it being someone else's spark.
          $t = $t.Replace(
            'Glass::DrawIcon(wdl, Glass::Icon::Spark,',
            'Glass::DrawIcon(wdl, Glass::Icon::Display,')

          # 8. The welcome splash. liquidDX11 opens on its own spark and the
          #    macOS-setup greeting - hello, Bonjour, Hola - which is charming
          #    and belongs to someone else. The mark becomes the real BetterCast
          #    logo, loaded as a texture from beside the exe with the display
          #    glyph as a fallback, and the word becomes the app's own name.
          #
          #    Arrays joined with newlines rather than a here-string, for the
          #    reason given below: a here-string terminator has to sit at column
          #    0, and a column-0 line inside a YAML block scalar ends the block.
          $splashOld = @(
            '            Glass::DrawIcon(fdl, Glass::Icon::Spark, ImVec2(cw * 0.5f, ch * 0.5f - 120.0f * scale),',
            '                            116.0f * scale, IM_COL32(255, 255, 255, (int)(235 * logoA)), 2.5f);'
          ) -join $lf
          $splashNew = @(
            '            {',
            '                static ID3D11ShaderResourceView* bcMark = nullptr;',
            '                static bool bcMarkTried = false;',
            '                if (!bcMarkTried) {',
            '                    bcMarkTried = true;',
            '                    std::string mp = AssetPath("bettercast-logo.png", nullptr);',
            '                    int wn = MultiByteToWideChar(CP_ACP, 0, mp.c_str(), -1, nullptr, 0);',
            '                    if (wn > 1) {',
            '                        std::wstring wp((size_t)wn - 1, 0);',
            '                        MultiByteToWideChar(CP_ACP, 0, mp.c_str(), -1, &wp[0], wn);',
            '                        bcMark = LoadWICTexture(g_pd3dDevice, wp.c_str());',
            '                    }',
            '                }',
            '                const float ms = 132.0f * scale;',
            '                const ImVec2 mc(cw * 0.5f, ch * 0.5f - 120.0f * scale);',
            '                if (bcMark) {',
            '                    fdl->AddImage((ImTextureID)(size_t)bcMark,',
            '                                  ImVec2(mc.x - ms * 0.5f, mc.y - ms * 0.5f),',
            '                                  ImVec2(mc.x + ms * 0.5f, mc.y + ms * 0.5f),',
            '                                  ImVec2(0, 0), ImVec2(1, 1),',
            '                                  IM_COL32(255, 255, 255, (int)(255 * logoA)));',
            '                } else {',
            '                    Glass::DrawIcon(fdl, Glass::Icon::Display, mc, 116.0f * scale,',
            '                                    IM_COL32(255, 255, 255, (int)(235 * logoA)), 2.5f);',
            '                }',
            '            }'
          ) -join $lf
          if (-not $t.Contains($splashOld)) { throw "splash mark patch did not apply" }
          $t = $t.Replace($splashOld, $splashNew)

          $before = $t
          $t = $t.Replace(
            'static const char* greet[] = { "hello", "Bonjour", "Hola" };',
            'static const char* greet[] = { "BetterCast" };')
          if ($t -eq $before) { throw "splash greeting patch did not apply" }
          $before = $t
          $t = $t.Replace('            const int N = 3;', '            const int N = 1;')
          if ($t -eq $before) { throw "splash greeting count patch did not apply" }

          Set-Content $main $t -Encoding utf8
          Write-Host "main.cpp patched: bridge, entry point, pump, icon, account, dock, mark, splash"

          # The account state behind the profile pages. main.cpp's chip was
          # already patched, but the name and email it edits live here, and
          # they are liquidDX11's author's - so the profile page still
          # introduced this PC as somebody else.
          #
          # ui_state.inc is included inside main(), after the bridge is up, so
          # a statement here runs exactly once with the real values available.
          $state = 'liquid-bc/examples/example_win32_directx11/src/app/ui_state.inc'
          $u = (Get-Content $state -Raw).Replace([string][char]13 + $lf, $lf)
          $acctNew = @(
            '    static char  acctName[64] = {}, acctEmail[64] = {};',
            '    std::snprintf(acctName,  sizeof(acctName),  "%s", BetterCastBridge::userName().c_str());',
            '    std::snprintf(acctEmail, sizeof(acctEmail), "%s", BetterCastBridge::userHandle().c_str());'
          ) -join $lf
          $before = $u
          $u = $u.Replace(
            '    static char  acctName[64] = "poncipp", acctEmail[64] = "@pondot";',
            $acctNew)
          if ($u -eq $before) { throw "account state patch did not apply" }
          Set-Content $state $u -Encoding utf8
          Write-Host "ui_state.inc patched: the account is this PC"

      - name: Add the BetterCast core to the spike target
        shell: pwsh
        run: |
          # CMake wants forward slashes; [char]92 avoids writing a backslash
          # literal, which has not survived this repo's tooling reliably.
          $sep   = [char]92
          $ws    = (Get-Location).Path.Replace($sep, '/')
          $spike = "$ws/bettercast/spike/glass-app"
          $core  = "$ws/bettercast/Sources/BetterCastReceiverDesktop"

          # UpdateChecker resolves the running version from this define, and
          # compares it against the latest GitHub release. Hardcoding it here
          # would let the spike drift from the installer and claim an update
          # that is already installed. Split rather than regex: a pattern for
          # this needs backslashes, which have not survived this repo's tooling.
          $verLine = Get-Content "$core/CMakeLists.txt" |
                     Where-Object { $_ -like 'project(BetterCastReceiver VERSION*' }
          if (-not $verLine) { throw "could not read the version out of CMakeLists.txt" }
          $bcVersion = ($verLine -split ' ')[2].TrimEnd(')')
          Write-Host "spike version: $bcVersion"

          # An array joined with newlines, not a here-string: a PowerShell
          # here-string terminator has to sit at column 0, and inside a YAML
          # block scalar a column-0 line ends the block and breaks the file.
          #
          # Appended rather than merged: liquidDX11 builds one executable from
          # its own main.cpp, and this adds the Qt core to that same target.
          # AUTOMOC is a target property because CMAKE_AUTOMOC only applies to
          # targets declared after it, and this runs long after add_executable.
          $block = @(
            '',
            '# ---- BetterCast bridge (spike only) ----',
            'find_package(Qt6 REQUIRED COMPONENTS Core Gui Widgets Network OpenGL OpenGLWidgets Multimedia)',
            'set_target_properties(liquidDX11 PROPERTIES AUTOMOC ON)',
            'target_sources(liquidDX11 PRIVATE',
            "    `"$spike/BetterCastBridge.cpp`"",
            "    `"$spike/BetterCastBridge.h`"",
            "    `"$core/ServiceDiscovery.cpp`"",
            "    `"$core/ServiceDiscovery.h`"",
            "    `"$core/LogManager.h`"",
            "    `"$core/NetworkListener.cpp`"",
            "    `"$core/NetworkListener.h`"",
            "    `"$core/VideoDecoder.cpp`"",
            "    `"$core/VideoDecoder.h`"",
            "    `"$core/VideoRenderer.cpp`"",
            "    `"$core/VideoRenderer.h`"",
            "    `"$core/AudioDecoder.cpp`"",
            "    `"$core/AudioDecoder.h`"",
            "    `"$core/AudioPlayer.cpp`"",
            "    `"$core/AudioPlayer.h`"",
            "    `"$core/Language.cpp`"",
            "    `"$core/Language.h`"",
            "    `"$core/UpdateChecker.cpp`"",
            "    `"$core/UpdateChecker.h`"",
            "    `"$core/sender/SenderController.cpp`"",
            "    `"$core/sender/SenderController.h`"",
            "    `"$core/sender/VideoEncoderFF.cpp`"",
            "    `"$core/sender/NetworkSender.cpp`"",
            "    `"$core/sender/NetworkSender.h`"",
            "    `"$core/sender/ScreenCaptureWin.cpp`"",
            "    `"$core/sender/VirtualDisplayVDD.cpp`"",
            "    `"$core/sender/VirtualDisplayVDD.h`"",
            "    `"$core/sender/InputInjector.cpp`"",
            "    `"$core/sender/InputInjector.h`"",
            "    `"$core/sender/ScreenCapture.h`"",
            "    `"$core/sender/ScreenCaptureWin.h`"",
            "    `"$core/sender/VideoEncoderFF.h`"",
            ')',
            "target_include_directories(liquidDX11 PRIVATE `"$spike`" `"$core`")",
            'target_compile_definitions(liquidDX11 PRIVATE ENABLE_SENDER=1',
            "    BETTERCAST_VERSION=`"$bcVersion`")",
            'find_package(FFMPEG REQUIRED)',
            'target_include_directories(liquidDX11 PRIVATE ${FFMPEG_INCLUDE_DIRS})',
            'target_link_directories(liquidDX11 PRIVATE ${FFMPEG_LIBRARY_DIRS})',
            'target_link_libraries(liquidDX11 PRIVATE',
            '    Qt6::Core Qt6::Gui Qt6::Widgets Qt6::Network Qt6::OpenGL Qt6::OpenGLWidgets',
            '    Qt6::Multimedia',
            '    ${FFMPEG_LIBRARIES}',
            '    d3d11 dxgi setupapi user32 winmm ws2_32)'
          ) -join "`n"
          Add-Content 'liquid-bc/CMakeLists.txt' $block -Encoding utf8
          Write-Host "appended BetterCast core from $core"

      - name: Build the BetterCast glass spike
        shell: pwsh
        run: |
          cmake -S liquid-bc -B build-spike -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="C:/vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DCMAKE_PREFIX_PATH="$env:Qt6_DIR"
          cmake --build build-spike --config Release

          $out = Get-ChildItem -Path build-spike -Filter 'liquidDX11.exe' -Recurse | Select-Object -First 1
          if (-not $out) { throw "the BetterCast build produced no exe" }
          Rename-Item $out.FullName 'BetterCastGlass.exe'

      - name: Collect
        shell: pwsh
        env:
          # For the scrcpy release lookup below. Unauthenticated calls to the
          # GitHub API are rate limited per runner IP, which on a shared pool
          # means the build fails for something no one here did.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          New-Item -ItemType Directory -Force out | Out-Null

          $ref = Get-ChildItem -Path build-ref -Filter 'liquidDX11.exe' -Recurse | Select-Object -First 1
          if (-not $ref) { throw "the reference build produced no exe" }
          Copy-Item $ref.FullName out/
          Write-Host "built: liquidDX11.exe  $([math]::Round($ref.Length/1MB,1)) MB"

          $bc = Get-ChildItem -Path build-spike -Filter 'BetterCastGlass.exe' -Recurse | Select-Object -First 1
          if (-not $bc) { throw "the BetterCast build produced no exe" }
          Copy-Item $bc.FullName out/
          Write-Host "built: BetterCastGlass.exe  $([math]::Round($bc.Length/1MB,1)) MB"

          # Qt runtime beside the binary, or the spike will not start on a
          # machine without Qt on PATH - which is every machine but the runner.
          & "$env:Qt6_DIR/bin/windeployqt.exe" --release --no-translations `
            --no-system-d3d-compiler --no-opengl-sw "out/BetterCastGlass.exe"

          # FFmpeg's DLLs too. windeployqt only knows about Qt, so without this
          # the spike dies at startup on "avcodec-61.dll was not found" - which
          # is what happened the first time the sender was linked in. The main
          # Windows workflow copies these the same way.
          $vcpkgBin = "C:/vcpkg/installed/x64-windows/bin"
          if (-not (Test-Path $vcpkgBin)) { throw "vcpkg bin missing - FFmpeg DLLs cannot be bundled" }
          Get-ChildItem "$vcpkgBin/*.dll" | ForEach-Object { Copy-Item $_.FullName out/ }

          # Fail here rather than on the user's machine.
          foreach ($need in 'avcodec-61.dll', 'avutil-59.dll', 'avformat-61.dll', 'swscale-8.dll') {
            if (-not (Test-Path "out/$need")) {
              Write-Host "note: $need not present; bundled DLLs are:"
              Get-ChildItem 'out/av*.dll', 'out/sw*.dll' -ErrorAction SilentlyContinue |
                ForEach-Object { Write-Host "  $($_.Name)" }
            }
          }
          $av = Get-ChildItem 'out/avcodec-*.dll' -ErrorAction SilentlyContinue
          if (-not $av) { throw "no avcodec DLL was bundled" }

          # Audio on the receive side is a QAudioSink, so this DLL and its
          # plugin directory have to travel too. Missing, the app starts fine
          # and simply never makes a sound - the kind of failure nobody
          # reports as a crash because it does not look like one.
          if (-not (Test-Path 'out/Qt6Multimedia.dll')) { throw "Qt6Multimedia.dll was not deployed" }

          # App icon, generated the same way build-windows-receiver.yml does so
          # the taskbar shows the rounded BetterCast mark rather than a default.
          pip install --quiet Pillow
          python -c "
          from PIL import Image, ImageDraw
          src = Image.open('bettercast/Sources/BetterCastReceiverDesktop/icon_256x256.png').convert('RGBA')
          size = max(src.size)
          src = src.resize((size, size), Image.LANCZOS)
          mask = Image.new('L', (size * 4, size * 4), 0)
          ImageDraw.Draw(mask).rounded_rectangle([0, 0, size * 4 - 1, size * 4 - 1], radius=int(size * 4 * 0.22), fill=255)
          mask = mask.resize((size, size), Image.LANCZOS)
          out = Image.new('RGBA', (size, size), (0, 0, 0, 0))
          out.paste(src, (0, 0), mask)
          out.save('out/appicon.ico', sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)])
          # Same mark again for the welcome splash, but from the 2048px master
          # rather than the 256px icon source: the splash draws it around 130
          # logical pixels, which is several hundred real ones on a scaled
          # display, and an upscaled icon looks it.
          big = Image.open('bettercast/assets/branding/AppIcon.png').convert('RGBA')
          ls = 512
          big = big.resize((ls, ls), Image.LANCZOS)
          lmask = Image.new('L', (ls * 4, ls * 4), 0)
          ImageDraw.Draw(lmask).rounded_rectangle([0, 0, ls * 4 - 1, ls * 4 - 1], radius=int(ls * 4 * 0.22), fill=255)
          lmask = lmask.resize((ls, ls), Image.LANCZOS)
          logo = Image.new('RGBA', (ls, ls), (0, 0, 0, 0))
          logo.paste(big, (0, 0), lmask)
          logo.save('out/bettercast-logo.png')
          "
          if (-not (Test-Path 'out/appicon.ico')) { throw "appicon.ico was not generated" }
          # The welcome splash draws this. Without it the splash falls back to a
          # glyph, which is not wrong but is not the logo either - so fail here
          # rather than ship a build that quietly lost its own mark.
          if (-not (Test-Path 'out/bettercast-logo.png')) { throw "bettercast-logo.png was not generated" }

          # scrcpy and adb, for mirroring an Android phone onto this PC. Not
          # reimplemented: Genymobile's tool already does this well, it is
          # Apache-2.0 which sits fine inside a GPLv3 project, and it brings
          # Google's adb with it.
          #
          # The release is resolved rather than pinned to a guessed filename -
          # the asset name carries the version, so a pin goes stale silently.
          # The version that was used is printed, since "latest" means this is
          # not reproducible on its own.
          $hdr = @{ 'User-Agent' = 'bettercast-build'
                    'Authorization' = "Bearer $env:GITHUB_TOKEN" }
          $rel = Invoke-RestMethod "https://api.github.com/repos/Genymobile/scrcpy/releases/latest" -Headers $hdr
          $asset = $rel.assets | Where-Object { $_.name -like 'scrcpy-win64-*.zip' } | Select-Object -First 1
          if (-not $asset) { throw "no scrcpy win64 asset in $($rel.tag_name)" }
          Write-Host "bundling $($asset.name) ($([math]::Round($asset.size/1MB,1)) MB)"
          Invoke-WebRequest $asset.browser_download_url -OutFile 'scrcpy.zip' `
            -Headers @{ 'User-Agent' = 'bettercast-build' }
          Expand-Archive 'scrcpy.zip' -DestinationPath 'scrcpy-tmp' -Force
          $sdir = Get-ChildItem 'scrcpy-tmp' -Directory | Select-Object -First 1
          if (-not $sdir) { throw "the scrcpy archive had no directory in it" }
          Copy-Item $sdir.FullName 'out/scrcpy' -Recurse
          # The bridge looks for exactly these two names beside the exe.
          foreach ($need in 'scrcpy.exe', 'adb.exe') {
            if (-not (Test-Path "out/scrcpy/$need")) { throw "$need missing from the scrcpy bundle" }
          }
          Set-Content 'out/scrcpy/BUNDLED_VERSION.txt' $rel.tag_name -Encoding utf8

          # Both apps load fonts from beside the binary.
          foreach ($d in 'data', 'misc/fonts') {
            $src = Join-Path 'liquidDX11' $d
            if (Test-Path $src) { Copy-Item -Recurse $src out/ -ErrorAction SilentlyContinue }
          }

      - name: Download Virtual Display Driver (VDD)
        shell: pwsh
        run: |
          # Same release the shipping installer bundles, so a machine with both
          # installed is not being handed two different drivers.
          $vddTag = '${{ env.VDD_VERSION }}'
          $baseUrl = "https://github.com/VirtualDrivers/Virtual-Display-Driver/releases/download/$vddTag"
          New-Item -ItemType Directory -Force vdd | Out-Null
          try {
            Invoke-WebRequest "$baseUrl/VirtualDisplayDriver-x86.Driver.Only.zip" `
              -OutFile 'vdd-driver.zip' -MaximumRedirection 5
            Expand-Archive 'vdd-driver.zip' -DestinationPath 'vdd-driver-extract' -Force
            Get-ChildItem 'vdd-driver-extract' -Recurse -File |
              ForEach-Object { Copy-Item $_.FullName 'vdd/' -Force }

            Invoke-WebRequest "$baseUrl/VDD.Control.$vddTag.zip" `
              -OutFile 'vdd-control.zip' -MaximumRedirection 5
            Expand-Archive 'vdd-control.zip' -DestinationPath 'vdd-control-extract' -Force
            Get-ChildItem 'vdd-control-extract' -Recurse -File |
              ForEach-Object { Copy-Item $_.FullName 'vdd/' -Force }

            Write-Host "VDD: $((Get-ChildItem 'vdd' -File).Count) files"
          } catch {
            # Not fatal: the installer's VDD section is optional, and an app
            # without it still receives and still mirrors. It cannot extend.
            Write-Host "WARNING: could not fetch VDD - the installer will not bundle it: $_"
          }

      - name: Install NSIS
        shell: pwsh
        run: |
          $nsisVersion = '3.10'
          Invoke-WebRequest "https://github.com/nicehash/NSIS/releases/download/v$nsisVersion/nsis-$nsisVersion.zip" `
            -OutFile 'nsis.zip'
          Expand-Archive 'nsis.zip' -DestinationPath 'C:/nsis' -Force
          $nsisDir = Get-ChildItem 'C:/nsis' -Directory | Select-Object -First 1
          if ($nsisDir) { echo "$($nsisDir.FullName)" >> $env:GITHUB_PATH }
          else          { echo 'C:/nsis' >> $env:GITHUB_PATH }

      - name: Build the installer
        shell: pwsh
        run: |
          # NSIS resolves File paths relative to the .nsi, so everything it
          # references is staged beside a copy of the script.
          $stage = 'installer-stage'
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item 'bettercast/spike/glass-app/installer.nsi' $stage
          Copy-Item 'out' "$stage/artifact" -Recurse
          Copy-Item 'out/appicon.ico' $stage           # MUI_ICON, beside the script
          if (Test-Path 'vdd') { Copy-Item 'vdd' "$stage/vdd" -Recurse }

          # The unmodified reference build is for comparing against, not for
          # shipping to anyone.
          Remove-Item "$stage/artifact/liquidDX11.exe" -ErrorAction SilentlyContinue

          # Version from CMakeLists, the same source the About box and the
          # update checker read, so an installer can never claim a version the
          # app disagrees with.
          $verLine = Get-Content 'bettercast/Sources/BetterCastReceiverDesktop/CMakeLists.txt' |
                     Where-Object { $_ -like 'project(BetterCastReceiver VERSION*' }
          if (-not $verLine) { throw "could not read the version out of CMakeLists.txt" }
          $bcVersion = ($verLine -split ' ')[2].TrimEnd(')')

          Push-Location $stage
          makensis /DPRODUCT_VERSION="$bcVersion" installer.nsi
          if ($LASTEXITCODE -ne 0) { throw "makensis failed with $LASTEXITCODE" }
          Pop-Location

          $setup = Get-ChildItem "$stage/BetterCastGlass-Setup-*.exe" | Select-Object -First 1
          if (-not $setup) { throw "makensis reported success but produced no installer" }
          Move-Item $setup.FullName '.'
          Write-Host "built: $($setup.Name)  $([math]::Round($setup.Length/1MB,1)) MB"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: BetterCastGlass-Setup-Windows-x64
          path: BetterCastGlass-Setup-*.exe
          if-no-files-found: error

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: liquidDX11-glass-spike
          path: out/
          if-no-files-found: error
